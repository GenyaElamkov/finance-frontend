server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Безопасность
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
 

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Ассеты собраны Vite с хешем в имени файла — кешируем надолго и агрессивно
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    # index.html не кешируем — иначе браузер не увидит новый деплой
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback для Vue Router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
