services:
  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000/api/v1}
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
