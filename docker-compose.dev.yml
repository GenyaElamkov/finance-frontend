services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: finance-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # анонимный volume, чтобы контейнерный node_modules не затирался хостовым
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://127.0.0.1:8000/api/v1}
      - CHOKIDAR_USEPOLLING=true # нужно для надёжного file-watching на Windows/macOS (bind mount)
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
